[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scenes",
    "crates/meta",
    "crates/tui",
    "crates/bridge",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ryan Schubert <ryan@stomale.cc>"]
repository = "https://github.com/rpschube/scia"
rust-version = "1.85"

[package]
name = "scia"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "scia"
path = "src/main.rs"

[dependencies]
scia-core = { path = "crates/core", version = "0.0.0" }
scia-scenes = { path = "crates/scenes", version = "0.0.0" }
scia-meta = { path = "crates/meta", version = "0.0.0" }
scia-tui = { path = "crates/tui", version = "0.0.0" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
