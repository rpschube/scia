[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/scenes",
    "crates/meta",
    "crates/tui",
    "crates/bridge",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Ryan Schubert <ryan@stomale.cc>"]
repository = "https://github.com/rpschube/scia"
homepage = "https://github.com/rpschube/scia"
description = "A real-time music visualizer for the terminal."
rust-version = "1.85"

[package]
name = "scia"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
rust-version.workspace = true

[features]
# Linux system-mix capture via the PipeWire host. Off by default so the
# standard gate builds stay PipeWire-free (no libpipewire-0.3-dev needed);
# the pipewire CI job and Linux probe/dist builds turn it on. Without it the
# Linux binary falls back to the ALSA default *input* (microphone-level), so
# any build meant to visualize system audio on Linux must enable this.
capture-pipewire = ["scia-core/capture-pipewire"]

[[bin]]
name = "scia"
path = "src/main.rs"

[dependencies]
scia-core = { path = "crates/core", version = "0.0.0" }
scia-scenes = { path = "crates/scenes", version = "0.0.0" }
scia-meta = { path = "crates/meta", version = "0.0.0" }
scia-tui = { path = "crates/tui", version = "0.0.0" }
clap = { version = "4", features = ["derive"] }
# Config-file parsing (US-UX-1). Both crates are already in the workspace tree
# (scia-scenes' preset format uses them), so this adds no new dependency.
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
