# lattice — the pulse-lattice preset.
#
# A copy-and-edit template: every table and key the preset format understands
# appears here, either set or shown in a comment. See docs/presets.md for the
# full reference (types, ranges, the feature vocabulary, curve formulas,
# envelope semantics and the error format).

[preset]
# Required. The preset's own name: ^[a-z0-9][a-z0-9-]*$ (lowercase, digits,
# dashes; must start alphanumeric).
name = "lattice"
# Required. A registered scene id. `lattice` is the pulse lattice.
scene = "lattice"
# Optional. A one-line human description.
description = "A calm dot lattice; onsets fire rings that ripple outward and loudness sets the base glow."
# Optional. A one-word mood; defaults to the scene's own mood ("serene").
mood = "serene"

# Typed parameters for the preset's scene. Every key must exist in the scene's
# parameter manifest; every value is a number within the stated range. Omitted
# keys keep their manifest default.
[params]
# density    24     range 4.0..=96.0   dots across the width (rows follow from the aspect)
density = 24
# ring_speed 0.9    range 0.1..=4.0    how fast a ring front travels (canvas units / second)
ring_speed = 0.9
# ring_width 0.14   range 0.02..=0.5   thickness of the ring front (canvas units)
ring_width = 0.14
# flash      0.7    range 0.0..=1.0    ring brightness boost as its front passes a dot
flash = 0.7
# glow       0.35   range 0.0..=1.0    base dot intensity that loudness rides on
glow = 0.35

# Optional layer stack. With no [[layer]] tables the preset is exactly one
# layer: [preset].scene with [params]. Each layer names its own scene, an
# optional blend (over | add | max, default over) and intensity (0.0..=1.0,
# default 1.0); [layer.params] is typed against THAT layer's scene manifest and
# merges over its defaults. When layers are present, [map] targets the FIRST
# layer's scene.
#
# [[layer]]
# scene = "lattice"
# blend = "over"
# intensity = 1.0
# [layer.params]
# glow = 0.5

# Feature -> parameter mappings. Each key is a parameter of the mapped scene;
# each value is a table naming a feature and a response. A string value here is
# reserved for the expression VM (a later card) and is rejected today.
#
# feature:  bass | mid | treb | loud | peak | onset | flux | beat | width
# curve:    linear | pow (needs exponent > 0) | log | step (needs threshold 0..=1)
# attack_ms / decay_ms >= 0 (default 0 = instant); scale default 1.0; offset default 0.0
[map]
# Ride the base glow on overall loudness: a gentle attack, a slow release, so
# the whole lattice breathes with the track's dynamics.
glow = { feature = "loud", curve = "linear", attack_ms = 30, decay_ms = 200, scale = 0.6, offset = 0.15 }

[palette]
# static | album-art. `album-art` is accepted and validated but resolves to the
# host default palette until the album-art card lands.
source = "static"
# Optional. When present, exactly 8 "#rrggbb" entries; only meaningful with a
# static source. Omit to use the host default palette.
slots = ["#0d3b3b", "#1f8f8f", "#3fd0d0", "#ffb020", "#ff6b5b", "#14161c", "#8a8f9c", "#e6e8ee"]
