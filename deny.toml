[graph]
all-features = true

[licenses]
# CDLA-Permissive-2.0 covers the Mozilla CA-root bundle (webpki-roots), pulled
# in for TLS by the album-art HTTP client in scia-meta. It is a permissive
# license with no copyleft or attribution burden on downstream code.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "BSL-1.0", "CC0-1.0", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "OpenSSL", "CDLA-Permissive-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
