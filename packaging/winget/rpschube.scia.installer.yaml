# winget installer manifest for scia — TEMPLATE.
#
# Fields wrapped in __DOUBLE_UNDERSCORES__ are filled by the release process
# (see packaging/winget/README.md). Everything else is final.
#
#   __VERSION__  the released version, e.g. 1.2.0 (no leading "v")
#   __SHA256__   SHA-256 of scia-x86_64-pc-windows-msvc.zip, uppercase hex,
