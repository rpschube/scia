Commands:
  - scia
ReleaseDate: __RELEASE_DATE__
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/rpschube/scia/releases/download/v__VERSION__/scia-x86_64-pc-windows-msvc.zip
    InstallerSha256: __SHA256__
ManifestType: installer
ManifestVersion: 1.6.0
