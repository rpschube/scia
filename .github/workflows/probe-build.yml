# probe-build — on-demand builds of the headless probe binaries for real
# machines (no scheduled runs; never part of the PR gate). Produces the
# `capture_probe` example and the `scia` binary for one target as an artifact,
# so a probe can be run on hardware that has no Rust toolchain.
name: probe-build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Runner OS to build on
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest
      ref:
        description: Git ref to build (branch, tag or SHA)
        type: string
        default: master

concurrency:
  group: probe-build-${{ github.workflow }}-${{ inputs.target }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.target }}
    runs-on: ${{ inputs.target }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install system audio headers (Linux only; cpal → alsa-sys + PipeWire)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # libpipewire/libspa are what the `capture-pipewire` feature links —
          # without that feature a Linux binary captures the default *input*
          # (microphone), not the system mix, so Linux probe builds enable it.
          sudo apt-get install -y -qq --no-install-recommends \
            libasound2-dev libpipewire-0.3-dev libspa-0.2-dev

      - name: Install toolchain (pinned by rust-toolchain.toml)
        run: |
          rustup toolchain install --profile minimal
          rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build probes (debug profile, no LTO — these are diagnostics)
        shell: bash
        run: |
          # Linux probe binaries must capture the system mix, so they carry
          # the capture-pipewire feature; other OSes need no feature.
          features=()
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            features=(--features capture-pipewire)
          fi
          cargo build -p scia-core --example capture_probe "${features[@]}"
          cargo build -p scia-core --example latency_probe "${features[@]}"
          cargo build -p scia-core --example beat_probe "${features[@]}"
          # The SMTC now-playing / artwork probe lives in scia-meta (which has no
          # capture-pipewire feature), so it takes no feature flags. On Windows
          # it drives the real backend; on other OSes it builds as a stub.
          cargo build -p scia-meta --example meta_probe
          # The scia binary is what staging machines run INTERACTIVELY: a debug
          # build renders frames 10-50x slower than release, overruns the frame
          # budget on modest hardware, and starves input — so it, alone, is
          # built with the release profile (fat LTO per Cargo.toml).
          cargo build --release --bin scia "${features[@]}"

      - name: Enforce release binary size budget (US-DIST-1)
        shell: bash
        run: |
          set -euo pipefail
          # The scia binary above is the release profile dist ships (fat LTO,
          # stripped). Assert it stays within the 10 MiB budget on the real
          # per-OS build, so the guard also covers the Windows and macOS sizes
          # that dist-size-guard.yml (Linux-only) does not.
          bin="target/release/scia"
          [[ "${{ runner.os }}" == "Windows" ]] && bin="target/release/scia.exe"
          scripts/check-dist-size.sh "$bin"

      - name: Collect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/debug/examples/capture_probe* out/ 2>/dev/null || true
          cp target/debug/examples/latency_probe* out/ 2>/dev/null || true
          cp target/debug/examples/beat_probe* out/ 2>/dev/null || true
          cp target/debug/examples/meta_probe* out/ 2>/dev/null || true
          cp target/release/scia* out/ 2>/dev/null || true
          rm -f out/*.d out/*.pdb
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: probes-${{ inputs.target }}-${{ github.sha }}
          path: out/
          retention-days: 7
