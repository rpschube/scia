[package]
name = "scia-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }

# The MPRIS backend and its artwork fetch are Linux-only. zbus talks D-Bus on
# its own async-io executor (no tokio, so the workspace gains no required async
# runtime); async-io/futures-lite drive that executor on the backend thread;
# ureq fetches https album art (file:// and data: URLs need no network).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
futures-lite = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }
