[package]
name = "scia-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# The MPRIS backend and its artwork fetch are Linux-only. zbus talks D-Bus on
# its own async-io executor (no tokio, so the workspace gains no required async
# runtime); async-io/futures-lite drive that executor on the backend thread;
# ureq fetches https album art (file:// and data: URLs need no network).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
# A one-shot shutdown wake for the backend thread: closing the channel resolves
# the stop future the reconcile loop races against, cancelling any in-flight
# D-Bus call so the join returns at once. Already in the tree via zbus, so this
# adds no new dependency (clears cargo-deny).
async-channel = "2"
futures-lite = "2"
ureq = { version = "2", default-features = false, features = ["tls"] }

# The Windows now-playing backend (SMTC). Windows-only: this dependency never
# enters a non-Windows build, so Linux and macOS builds are untouched. Licensed
# MIT OR Apache-2.0 (clears cargo-deny). Only the WinRT namespaces the SMTC
# backend touches are enabled, plus `Win32_System_Com` for the multithreaded
# apartment init the WinRT event delivery needs.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
]

# The MPRIS shutdown regression test serves a fake player on a private bus it
# spawns; it needs zbus to serve that interface and async-io to drive it. Both
# are already the backend's own deps, so nothing new enters the tree.
[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
async-io = "2"
