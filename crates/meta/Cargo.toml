[package]
name = "scia-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }

# The Windows now-playing backend (SMTC). Windows-only: this dependency never
# enters a non-Windows build, so Linux and macOS builds are untouched. Licensed
# MIT OR Apache-2.0 (clears cargo-deny). Only the WinRT namespaces the SMTC
# backend touches are enabled, plus `Win32_System_Com` for the multithreaded
# apartment init the WinRT event delivery needs.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
]
