[package]
name = "scia-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }
scia-scenes = { path = "../scenes", version = "0.0.0" }
scia-meta = { path = "../meta", version = "0.0.0" }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
# zlib compression of kitty-graphics image payloads (US-TUI-3). Default features
# use the pure-Rust miniz_oxide backend; already present in the workspace tree.
flate2 = "1"
