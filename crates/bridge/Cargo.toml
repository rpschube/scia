[package]
name = "scia-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "scia-bridge"
path = "src/main.rs"

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# The end-to-end serve test decodes the bridge's stream with the library's own
# wire readers; scia-core is already the runtime dependency, so this adds no new
# third-party crate to the tree.
scia-core = { path = "../core", version = "0.0.0" }
