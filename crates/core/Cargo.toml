[package]
name = "scia-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["capture-cpal", "perf-mode", "route-notify"]
# The cpal-based capture backend (Windows WASAPI loopback, Linux ALSA/PipeWire,
# macOS Core Audio input). On by default.
capture-cpal = ["dep:cpal"]
# Windows-only opt-in "perf mode": a companion silent shared-mode render stream
# (IAudioClient3) opened at the endpoint's minimum engine period, so a loopback
# capture on that endpoint delivers packets at the fast cadence. On by default,
# but it ONLY affects Windows: on every other platform the module is a
# compile-everywhere stub whose `open` returns `Unsupported`, and the `windows`
# crate it links is a `cfg(windows)` dependency that never enters a non-Windows
# build. Reuses `DeviceSelector`, so it pulls in `capture-cpal`.
perf-mode = ["capture-cpal", "dep:windows"]
# Windows-only event-driven route-change notification: an `IMMNotificationClient`
# registered with the device enumerator flips the engine's reopen-request flag
# the instant the default render endpoint changes or a device is removed, so a
# switch is picked up on the route watcher's next tick instead of waiting out a
# poll cycle. On by default, but it ONLY affects Windows: on every other platform
# the module is a compile-everywhere stub whose `start` returns `Unsupported` and
# the engine falls back to polling. Shares the same `cfg(windows)` `windows`
# dependency perf mode links (never entering a non-Windows build).
route-notify = ["dep:windows", "dep:windows-core"]
# Enable cpal's native PipeWire host so Linux can capture the system output mix
# (a sink monitor). OFF by default: it links libpipewire development libraries
# that are not present on every build host, so it must not ride in an
# all-features build. A real build with this feature needs the PipeWire dev
# headers installed.
capture-pipewire = ["cpal/pipewire"]

[dependencies]
realfft = "3"
rtrb = "0.4"
thiserror = "2"
triple_buffer = "9"
# Machine-readable feature stream (US-UX-2): serde derives on the wire frame and
# NDJSON encoding. Both crates already ride in the workspace tree (the golden
# DSP tests use them), so this adds no new third-party dependency. Kept UI-free —
# the `core-deps` gate still holds.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.cpal]
# Pinned exactly. The Linux system-mix baseline relies on cpal's PipeWire host
# exposing an `Audio/Sink` as a duplex (input-capable) device and, when an input
# stream is opened on it, setting `PW_KEY_STREAM_CAPTURE_SINK=true` so the stream
# captures the sink monitor. That is specified only in cpal's source
# (`host/pipewire/device.rs`), not its public contract, so the exact version is
# pinned and the behaviour is continuously verified by the `pipewire` CI job and
# `crates/core/tests/pipewire.rs`. See `docs/probes/p2-pipewire-pin.md`.
version = "=0.18.2"
optional = true

# Perf mode's raw WASAPI COM backend. Windows-only (the crate itself is
# `#![cfg(windows)]`) and optional, enabled by the `perf-mode` feature. Licensed
# MIT OR Apache-2.0.
# The #[implement] macro in `wasapi_route` expands to absolute `::windows_core`
# paths, so the core crate must name the crate directly. Windows-only and
# optional, enabled by the same `route-notify` feature. Licensed MIT OR Apache-2.0.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"
optional = true

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
optional = true
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_FunctionDiscovery",
]

[dev-dependencies]
# Golden-file DSP tests only: WAV fixture I/O and JSON golden files. None of
# these reach the shipped library — they are test/example scaffolding.
hound = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
