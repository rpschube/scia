[package]
name = "scia-scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Filesystem watcher for live preset hot-reload (US-CFG-2). The recommended
# watcher observes the preset file's parent directory so an editor's
# rename-replace save is caught.
notify = "8"

# The scenes crate now carries serde + toml for the preset format. The mlua and
# criterion dev-dependencies below remain probe-only (P5): they exist solely for
# benches/tests that measure a Luau scene tick against the real FeatureSnapshot
# shapes. See docs/probes/p5-luau-tick.md.
[dev-dependencies]
scia-core = { path = "../core", version = "0.0.0" }
mlua = { version = "0.11", features = ["luau", "vendored"] }
criterion = { version = "0.6", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "luau_tick"
harness = false
