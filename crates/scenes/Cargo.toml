[package]
name = "scia-scenes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
scia-core = { path = "../core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
# Filesystem watcher for live preset hot-reload (US-CFG-2). The recommended
# watcher observes the preset file's parent directory so an editor's
# rename-replace save is caught.
notify = "8"
# Expression mappings (US-CFG-3): a `[map]` value may be a string expression
# compiled at preset load and evaluated per frame. The safe compiled-slab API is
# allocation-free after construction; default features (which include
# `unsafe-vars`) are disabled — the namespace is a plain compiled slab evaluated
# against a fixed variable set.
fasteval = { version = "0.2", default-features = false }

# Sandboxed Luau scenes (US-CFG-4): a `.lua` scene binds to the same Scene trait
# as a built-in. `luau` selects the Luau VM (its `Lua::sandbox()` and per-VM
# memory limit + instruction interrupt are the isolation primitives), `vendored`
# builds the Luau runtime from source so no system library is needed.
mlua = { version = "0.11", features = ["luau", "vendored"] }

# The scenes crate now carries serde + toml for the preset format. The criterion
# dev-dependency below remains probe-only (P5): it exists solely for the bench
# that measures a Luau scene tick against the real FeatureSnapshot shapes. See
# docs/probes/p5-luau-tick.md.
[dev-dependencies]
scia-core = { path = "../core", version = "0.0.0" }
criterion = { version = "0.6", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "luau_tick"
harness = false
